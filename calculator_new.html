<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitaka Smart Calculator & Notes</title>
<link rel="icon" type="image/x-icon" href="calcu-favicon.ico">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #eef2f1;
  --card: #ffffff;
  --text: #10231f;
  --text-2: #4b5f5a;
  --text-3: #8a9c97;
  --border: #dce4e2;
  --key: #f2f5f4;
  --key-hover: #e6ecea;
  --sar: #0f7b5f;
  --sar-soft: #e3f4ee;
  --php: #2456c5;
  --php-soft: #e6edfb;
  --accent: #0f7b5f;
  --danger: #c62828;
  --ok: #0f7b5f;
  --shadow: 0 1px 2px rgba(16,35,31,.06), 0 8px 24px -12px rgba(16,35,31,.18);
  --font: 'Sora', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
:root[data-theme="dark"] {
  --bg: #0c1614;
  --card: #142220;
  --text: #e6f0ed;
  --text-2: #a3b7b1;
  --text-3: #6b807a;
  --border: #243633;
  --key: #1b2c29;
  --key-hover: #243836;
  --sar: #3ccf9f;
  --sar-soft: #12332b;
  --php: #7ea6ff;
  --php-soft: #16264d;
  --accent: #3ccf9f;
  --danger: #ff7b72;
  --ok: #3ccf9f;
  --shadow: 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 16px;
  font-family: var(--font); background: var(--bg); color: var(--text);
  display: flex; justify-content: center;
}
button, input, textarea { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { width: 100%; max-width: 1040px; display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; }

.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.head h2 { margin: 0; font-size: 13px; font-weight: 600; }
.head-actions { display: flex; align-items: center; gap: 6px; }
.meta { font-size: 11px; color: var(--text-3); }
.icon-btn {
  border: 1px solid var(--border); background: var(--key); border-radius: 9px;
  width: 28px; height: 28px; cursor: pointer; font-size: 13px; line-height: 1;
  display: grid; place-items: center; transition: background .15s;
}
.icon-btn:hover { background: var(--key-hover); }
.icon-btn.spin { animation: spin .7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Converter ── */
.rate-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.rate-big { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
.rate-big b { color: var(--text); font-weight: 600; }

.pair { position: relative; display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 10px;
  border-radius: 12px; padding: 8px 11px; border: 1.5px solid transparent;
  transition: border-color .15s;
}
.row[data-cur="SAR"] { background: var(--sar-soft); }
.row[data-cur="PHP"] { background: var(--php-soft); }
.row:focus-within[data-cur="SAR"] { border-color: var(--sar); }
.row:focus-within[data-cur="PHP"] { border-color: var(--php); }
.cur { display: flex; flex-direction: column; min-width: 44px; }
.cur b { font-size: 13px; font-weight: 700; }
.cur small { font-size: 9.5px; color: var(--text-2); }
.row[data-cur="SAR"] .cur b { color: var(--sar); }
.row[data-cur="PHP"] .cur b { color: var(--php); }
.row input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none;
  text-align: right; font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--text);
}
.row input::placeholder { color: var(--text-3); }
.swap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--card);
  background: var(--text); color: var(--card); cursor: pointer; font-size: 13px;
  display: grid; place-items: center; transition: transform .25s;
}
.swap.flip { transform: translate(-50%, -50%) rotate(180deg); }

.chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  flex: 1; min-width: 50px; padding: 6px 5px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--key);
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; transition: background .15s;
}
.chip:hover { background: var(--key-hover); }
.conv-actions { display: flex; gap: 6px; margin-top: 8px; }
.text-btn {
  flex: 1; padding: 7px 8px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; font-size: 10.5px; font-weight: 500; color: var(--text-2);
}
.text-btn:hover { background: var(--key); color: var(--text); }

/* ── Calculator ── */
.screen {
  background: var(--key); border-radius: 12px; padding: 10px 13px; margin-bottom: 10px;
  text-align: right; font-family: var(--mono); min-height: 62px;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.prev { font-size: 11.5px; color: var(--text-3); min-height: 16px; overflow-wrap: anywhere; }
.curr { font-size: 26px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.curr.err { color: var(--danger); font-size: 17px; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.keys button {
  padding: 11px 0; font-size: 15px; font-weight: 500; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); transition: background .12s, transform .05s;
}
.keys button:hover { background: var(--key-hover); }
.keys button:active { transform: scale(.96); }
.keys .fn { background: var(--key); color: var(--text-2); font-size: 12.5px; }
.keys .op { background: var(--sar-soft); color: var(--sar); border-color: transparent; font-size: 16px; }
.keys .op.active { background: var(--sar); color: var(--card); }
.keys .eq { background: var(--sar); color: #fff; border-color: transparent; }
.keys .eq:hover { filter: brightness(1.08); background: var(--sar); }

/* ── Notes ── */
.notes-card { display: flex; flex-direction: column; min-height: 600px; }
.note-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: thin; }
.note-tab {
  flex: 0 0 auto; max-width: 150px; padding: 6px 10px; border-radius: 999px;
  background: var(--key); border: 1px solid var(--border); font-size: 12px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px;
}
.note-tab.active { background: var(--accent); color: #fff; border-color: transparent; }
.note-tab .x { opacity: .55; font-size: 12px; line-height: 1; }
.note-tab:hover .x, .note-tab.active .x { opacity: .9; }
.new-note-btn {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
  border: 1px dashed var(--text-3); background: transparent; cursor: pointer;
  font-size: 15px; display: grid; place-items: center; color: var(--text-2);
}
.new-note-btn:hover { background: var(--key); }

.note-title-row { margin-bottom: 8px; }
#noteTitleInput {
  width: 100%; border: 1px solid var(--border); background: var(--key); border-radius: 10px;
  padding: 8px 12px; font-size: 14px; font-weight: 600; color: var(--text); outline: none;
}
#noteTitleInput:focus { border-color: var(--accent); background: var(--card); }

.note-toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.note-toolbar button {
  flex: 0 0 auto; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--key); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-2);
}
.note-toolbar button:hover { background: var(--key-hover); color: var(--text); }
.note-toolbar .hint { margin-left: auto; font-size: 11px; color: var(--text-3); align-self: center; }

.blocks {
  flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; background: var(--key); display: flex; flex-direction: column; gap: 10px;
}
.blocks.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.block { position: relative; }
.block .block-del {
  position: absolute; top: -7px; right: -7px; width: 19px; height: 19px; border-radius: 50%;
  background: var(--danger); color: #fff; border: none; font-size: 11px; line-height: 1;
  cursor: pointer; display: none; align-items: center; justify-content: center;
}
.block:hover .block-del { display: flex; }

.text-block textarea {
  width: 100%; border: none; background: transparent; resize: none; outline: none;
  font-family: var(--mono); font-size: 13.5px; line-height: 1.6; color: var(--text);
  min-height: 24px; overflow: hidden; display: block;
}
.text-block textarea::placeholder { color: var(--text-3); }

.image-block img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }

.table-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
.table-block .tbl-tools { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.table-block .tbl-tools button {
  font-size: 11px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--key); cursor: pointer; color: var(--text-2);
}
.table-block .tbl-tools button:hover { background: var(--key-hover); color: var(--text); }
table.grid { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12.5px; }
table.grid td { border: 1px solid var(--border); padding: 5px 7px; min-width: 56px; outline: none; }
table.grid td.sum { font-weight: 700; background: var(--sar-soft); color: var(--sar); }
table.grid td[contenteditable]:focus { background: var(--php-soft); }

.foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-3); }
.status { font-weight: 600; }
.status.ok { color: var(--ok); } .status.err { color: var(--danger); }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--card); padding: 9px 15px; border-radius: 10px;
  font-size: 12.5px; pointer-events: none; transition: all .2s; z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 800px) {
  body { padding: 10px; }
  .app { grid-template-columns: 1fr; }
  .notes-card { min-height: 420px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <div class="col">
    <!-- CONVERTER -->
    <section class="card">
      <div class="head">
        <h2>Currency converter</h2>
        <div class="head-actions">
          <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
          <button class="icon-btn" id="refreshBtn" title="Refresh rate" aria-label="Refresh rate">↻</button>
        </div>
      </div>
      <div class="rate-line">
        <span class="rate-big" id="rateMain">1 SAR = <b>…</b> PHP</span>
        <span class="meta" id="rateMeta">Loading rate…</span>
      </div>

      <div class="pair" id="pair">
        <div class="row" id="rowTop" data-cur="SAR">
          <div class="cur"><b>SAR</b><small>Saudi riyal</small></div>
          <input id="topInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount to convert">
        </div>
        <div class="row" id="rowBottom" data-cur="PHP">
          <div class="cur"><b>PHP</b><small>Philippine peso</small></div>
          <input id="bottomInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Converted amount">
        </div>
        <button class="swap" id="swapBtn" title="Swap direction (SAR ⇄ PHP)" aria-label="Swap direction">⇅</button>
      </div>

      <div class="chips" id="chips"></div>
      <div class="conv-actions">
        <button class="text-btn" id="copyBtn">Copy result</button>
        <button class="text-btn" id="toCalcBtn">Send to calculator</button>
      </div>
    </section>

    <!-- CALCULATOR -->
    <section class="card">
      <div class="screen">
        <div class="prev" id="prev"></div>
        <div class="curr" id="curr">0</div>
      </div>
      <div class="keys">
        <button class="fn" data-a="clear">AC</button>
        <button class="fn" data-a="neg">±</button>
        <button class="fn" data-a="pct">%</button>
        <button class="op" data-op="/" aria-label="Divide">÷</button>

        <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
        <button class="op" data-op="*" aria-label="Multiply">×</button>

        <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
        <button class="op" data-op="-" aria-label="Subtract">−</button>

        <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
        <button class="op" data-op="+" aria-label="Add">+</button>

        <button data-n="0">0</button><button data-n=".">.</button>
        <button class="fn" data-a="del" aria-label="Delete last digit">⌫</button>
        <button class="eq" data-a="eq">=</button>
      </div>
      <div class="conv-actions">
        <button class="text-btn" id="toConvBtn">Send to converter</button>
      </div>
    </section>
  </div>

  <!-- NOTES -->
  <section class="card notes-card">
    <div class="head">
      <h2>Notes</h2>
      <span class="status" id="saveStatus">Connecting…</span>
    </div>

    <div class="note-tabs" id="noteTabs"></div>

    <div class="note-title-row">
      <input id="noteTitleInput" placeholder="Untitled note" autocomplete="off">
    </div>

    <div class="note-toolbar">
      <button id="addTextBtn">+ Text</button>
      <button id="addTableBtn">+ Table</button>
      <button id="addImageBtn">+ Image</button>
      <input type="file" id="imageFileInput" accept="image/*" hidden>
      <span class="hint">Paste or drag a screenshot anywhere below</span>
    </div>

    <div class="blocks" id="blocks"></div>
    <div class="foot"><span id="count">0 blocks</span><span>Auto-saves while you type</span></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
    // ==========================================
    // FIREBASE INITIALIZATION
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAc46X6MIXI-moZ2oTy2ShiDv6IrjhVQC4",
      authDomain: "finance-app-23309.firebaseapp.com",
      databaseURL: "https://finance-app-23309-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "finance-app-23309",
      storageBucket: "finance-app-23309.firebasestorage.app",
      messagingSenderId: "268979076437",
      appId: "1:268979076437:web:204abafc00e7558f4e83dc",
    };
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
const db = firebase.database();


// ==========================================
// HELPERS
// ==========================================
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function withCommas(str) {
  const neg = str.startsWith('-'); if (neg) str = str.slice(1);
  const [i, d] = str.split('.');
  const out = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d !== undefined ? '.' + d : '');
  return (neg ? '-' : '') + out;
}
function num(str) { return parseFloat(String(str).replace(/,/g, '')); }
function fmtMoney(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function setStatus(text, cls) { const s = $('saveStatus'); s.textContent = text; s.className = 'status ' + (cls || ''); }

// ==========================================
// THEME
// ==========================================
(function () {
  const saved = store('pitaka-theme');
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
$('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store('pitaka-theme', next);
});

// ==========================================
// CONVERTER
// ==========================================
let rate = parseFloat(store('pitaka-rate')) || 14.8;
let topCur = 'SAR';
const topInput = $('topInput'), bottomInput = $('bottomInput');

function convert(amount, from) { return from === 'SAR' ? amount * rate : amount / rate; }
function renderRate(label) {
  $('rateMain').innerHTML = `1 SAR = <b>${rate.toFixed(4)}</b> PHP`;
  $('rateMeta').textContent = label;
}
async function fetchRate(manual) {
  $('refreshBtn').classList.add('spin');
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/SAR');
    const data = await res.json();
    if (!data.rates || !data.rates.PHP) throw new Error('no rate');
    rate = data.rates.PHP; store('pitaka-rate', rate);
    renderRate('Live · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    recalc();
    if (manual) toast('Rate updated');
  } catch (e) {
    renderRate(store('pitaka-rate') ? 'Offline · last saved rate' : 'Offline · default rate');
    if (manual) toast('Could not refresh. Check your connection.');
  }
  setTimeout(() => $('refreshBtn').classList.remove('spin'), 700);
}
function setCurrencyLabels() {
  const info = { SAR: 'Saudi riyal', PHP: 'Philippine peso' };
  const bottomCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  [['rowTop', topCur], ['rowBottom', bottomCur]].forEach(([id, c]) => {
    const row = $(id); row.dataset.cur = c;
    row.querySelector('b').textContent = c; row.querySelector('small').textContent = info[c];
  });
  const amounts = topCur === 'SAR' ? [100, 500, 1000, 5000] : [1000, 5000, 10000, 50000];
  $('chips').innerHTML = amounts.map(a => `<button class="chip" data-v="${a}">${a.toLocaleString('en-US')}</button>`).join('');
}
function cleanTyping(el) {
  let v = el.value.replace(/[^\d.]/g, '');
  const p = v.indexOf('.'); if (p !== -1) v = v.slice(0, p + 1) + v.slice(p + 1).replace(/\./g, '');
  el.value = v ? withCommas(v) : '';
}
function recalc() {
  const a = num(topInput.value);
  bottomInput.value = isNaN(a) ? '' : fmtMoney(convert(a, topCur));
}
topInput.addEventListener('input', () => { cleanTyping(topInput); recalc(); });
bottomInput.addEventListener('input', () => {
  cleanTyping(bottomInput);
  const b = num(bottomInput.value);
  const bottomCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  topInput.value = isNaN(b) ? '' : fmtMoney(convert(b, bottomCur));
});
$('swapBtn').addEventListener('click', () => {
  const result = bottomInput.value;
  topCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  setCurrencyLabels();
  topInput.value = result; recalc();
  $('swapBtn').classList.toggle('flip');
});
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  topInput.value = withCommas(c.dataset.v); recalc();
});
$('copyBtn').addEventListener('click', async () => {
  if (!bottomInput.value) return toast('Enter an amount first');
  const text = bottomInput.value.replace(/,/g, '');
  try { await navigator.clipboard.writeText(text); toast('Copied ' + bottomInput.value); }
  catch (e) { bottomInput.select(); document.execCommand('copy'); toast('Copied ' + bottomInput.value); }
});
$('toCalcBtn').addEventListener('click', () => {
  const v = num(bottomInput.value); if (isNaN(v)) return toast('Enter an amount first');
  cur = String(v.toFixed(2)); prevStr = ''; op = null; justComputed = false; render();
  toast('Sent to calculator');
});
$('refreshBtn').addEventListener('click', () => fetchRate(true));
setCurrencyLabels(); renderRate('Loading rate…'); fetchRate(false);

// ==========================================
// CALCULATOR
// ==========================================
let cur = '', prevStr = '', op = null, justComputed = false;
const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

function render() {
  const c = $('curr');
  if (cur === 'Error') { c.textContent = 'Cannot divide by zero'; c.classList.add('err'); }
  else { c.textContent = cur ? withCommas(cur) : '0'; c.classList.remove('err'); }
  $('prev').textContent = op ? `${withCommas(prevStr)} ${symbols[op]}` : '';
  document.querySelectorAll('.keys .op').forEach(b => b.classList.toggle('active', b.dataset.op === op && cur === ''));
}
function tidy(n) { return String(parseFloat(n.toPrecision(12))); }
function inputDigit(d) {
  if (cur === 'Error' || justComputed) { cur = ''; justComputed = false; }
  if (d === '.') { if (cur.includes('.')) return; if (cur === '' || cur === '-') cur += '0'; }
  else if (cur === '0') cur = '';
  if (cur.replace(/[-.]/g, '').length >= 15) return;
  cur += d; render();
}
function chooseOp(o) {
  if (cur === 'Error') return;
  if (cur === '' && prevStr !== '') { op = o; render(); return; }
  if (cur === '') return;
  if (prevStr !== '' && op) compute(true);
  op = o; prevStr = cur; cur = ''; justComputed = false; render();
}
function compute(chain) {
  if (!op || prevStr === '' || cur === '') return;
  const a = parseFloat(prevStr), b = parseFloat(cur); let r;
  switch (op) {
    case '+': r = a + b; break; case '-': r = a - b; break;
    case '*': r = a * b; break; case '/': r = b === 0 ? null : a / b; break;
  }
  if (r === null) { cur = 'Error'; prevStr = ''; op = null; render(); return; }
  cur = tidy(r); prevStr = ''; op = null; justComputed = !chain; render();
}
function clearAll() { cur = ''; prevStr = ''; op = null; justComputed = false; render(); }
function del() { if (justComputed || cur === 'Error') return clearAll(); cur = cur.slice(0, -1); render(); }
function negate() { if (!cur || cur === 'Error') return; cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; render(); }
function percent() {
  if (!cur || cur === 'Error') return;
  const v = parseFloat(cur);
  cur = tidy(prevStr !== '' && (op === '+' || op === '-') ? parseFloat(prevStr) * v / 100 : v / 100); render();
}
document.querySelector('.keys').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.n) inputDigit(b.dataset.n);
  else if (b.dataset.op) chooseOp(b.dataset.op);
  else switch (b.dataset.a) {
    case 'clear': clearAll(); break; case 'del': del(); break; case 'neg': negate(); break;
    case 'pct': percent(); break; case 'eq': compute(false); break;
  }
});
$('toConvBtn').addEventListener('click', () => {
  const v = num(cur || '0'); if (isNaN(v) || cur === 'Error') return toast('Nothing to send');
  topInput.value = withCommas(String(v)); recalc(); toast(`Sent to converter as ${topCur}`);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName.toLowerCase();
  const editable = document.activeElement.isContentEditable;
  if (tag === 'textarea' || tag === 'input' || editable || e.ctrlKey || e.metaKey) return;
  if (/^[0-9.]$/.test(e.key)) inputDigit(e.key);
  else if (['+', '-', '*', '/'].includes(e.key)) { e.preventDefault(); chooseOp(e.key); }
  else if (e.key === '=' || e.key === 'Enter') { e.preventDefault(); compute(false); }
  else if (e.key === 'Backspace') del();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '%') percent();
});
render();

// ==========================================
// NOTES — multi-note, blocks: text / image / table
// Firebase layout:
//   notesIndex/{id}   -> { title, updatedAt }   (small, always loaded)
//   notes/{id}        -> { blocks: [...] }      (loaded only for the open note)
// ==========================================
const tabsEl = $('noteTabs'), blocksEl = $('blocks'), titleInput = $('noteTitleInput');
let loggedIn = false;
let notesIndexCache = {};
let currentNoteId = null;
let currentBlocks = [];
let noteRef = null;
let lastFocusedIdx = null;
let saveTimeout, titleSaveTimeout;

function updateAuthUI() {
  const disabled = !loggedIn;
  [$('addTextBtn'), $('addTableBtn'), $('addImageBtn'), $('new-note-btn')].forEach(b => { if (b) b.disabled = disabled; });
  tabsEl.style.pointerEvents = disabled ? 'none' : '';
  titleInput.disabled = disabled;
}

function scheduleSave() {
  setStatus('Saving…');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    if (!currentNoteId || !loggedIn) return;
    db.ref('notes/' + currentNoteId).set({ blocks: currentBlocks })
      .then(() => {
        setStatus('Saved', 'ok');
        db.ref('notesIndex/' + currentNoteId + '/updatedAt').set(Date.now());
        if (!notesIndexCache[currentNoteId] || !notesIndexCache[currentNoteId].title) {
          const firstText = currentBlocks.find(b => b.type === 'text' && b.content && b.content.trim());
          if (firstText) db.ref('notesIndex/' + currentNoteId + '/title').set(firstText.content.trim().slice(0, 40));
        }
      })
      .catch(() => setStatus('Could not save. Check your connection.', 'err'));
  }, 700);
}

function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function removeBlock(idx) {
  currentBlocks.splice(idx, 1);
  if (currentBlocks.length === 0) currentBlocks.push({ type: 'text', content: '' });
  renderBlocks(); scheduleSave();
}

function createTextBlockEl(block, idx) {
  const wrap = document.createElement('div'); wrap.className = 'block text-block'; wrap.dataset.idx = idx;
  const ta = document.createElement('textarea');
  ta.value = block.content || '';
  ta.placeholder = currentBlocks.length === 1 ? 'Start typing…' : '';
  ta.readOnly = !loggedIn;
  ta.addEventListener('input', () => { block.content = ta.value; autoGrow(ta); scheduleSave(); });
  ta.addEventListener('focus', () => { lastFocusedIdx = idx; });
  wrap.appendChild(ta);
  if (currentBlocks.length > 1) {
    const d = document.createElement('button'); d.className = 'block-del'; d.textContent = '×'; d.title = 'Remove';
    d.addEventListener('click', () => removeBlock(idx)); wrap.appendChild(d);
  }
  requestAnimationFrame(() => autoGrow(ta));
  return wrap;
}

function createImageBlockEl(block, idx) {
  const wrap = document.createElement('div'); wrap.className = 'block image-block'; wrap.dataset.idx = idx; wrap.tabIndex = -1;
  const img = document.createElement('img'); img.src = block.data; img.alt = 'Pasted screenshot';
  wrap.appendChild(img);
  const d = document.createElement('button'); d.className = 'block-del'; d.textContent = '×'; d.title = 'Remove';
  d.addEventListener('click', () => removeBlock(idx)); wrap.appendChild(d);
  wrap.addEventListener('mouseenter', () => { lastFocusedIdx = idx; });
  return wrap;
}

function updateSums(table, data) {
  const rows = data.rows, nCols = rows[0].length, colSums = new Array(nCols).fill(0);
  const trs = table.querySelectorAll('tr');
  rows.forEach((row, r) => {
    let rowSum = 0;
    row.forEach((cell, c) => { const v = parseFloat(String(cell).replace(/,/g, '')); if (!isNaN(v)) { rowSum += v; colSums[c] += v; } });
    const rc = trs[r].querySelector('td.sum'); if (rc) rc.textContent = rowSum ? rowSum.toLocaleString('en-US') : '';
  });
  const sumTr = trs[rows.length];
  if (sumTr) { const cells = sumTr.querySelectorAll('td.sum'); colSums.forEach((s, i) => { if (cells[i]) cells[i].textContent = s ? s.toLocaleString('en-US') : ''; }); }
}

function createTableBlockEl(block, idx) {
  block.data = block.data || { rows: [['', '', ''], ['', '', '']], sums: false };
  const wrap = document.createElement('div'); wrap.className = 'block table-block'; wrap.dataset.idx = idx;

  const tools = document.createElement('div'); tools.className = 'tbl-tools';
  const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.disabled = !loggedIn; b.addEventListener('click', fn); return b; };
  tools.appendChild(mk('+ Row', () => { block.data.rows.push(block.data.rows[0].map(() => '')); renderBlocks(); scheduleSave(); }));
  tools.appendChild(mk('+ Column', () => { block.data.rows.forEach(r => r.push('')); renderBlocks(); scheduleSave(); }));
  tools.appendChild(mk(block.data.sums ? 'Hide totals' : 'Show totals', () => { block.data.sums = !block.data.sums; renderBlocks(); scheduleSave(); }));
  tools.appendChild(mk('Delete table', () => removeBlock(idx)));
  wrap.appendChild(tools);

  const table = document.createElement('table'); table.className = 'grid';
  block.data.rows.forEach((row, r) => {
    const tr = document.createElement('tr');
    row.forEach((cell, c) => {
      const td = document.createElement('td'); td.contentEditable = loggedIn ? 'true' : 'false'; td.textContent = cell;
      td.addEventListener('input', () => { block.data.rows[r][c] = td.textContent; if (block.data.sums) updateSums(table, block.data); scheduleSave(); });
      td.addEventListener('focus', () => { lastFocusedIdx = idx; });
      tr.appendChild(td);
    });
    if (block.data.sums) { const s = document.createElement('td'); s.className = 'sum'; tr.appendChild(s); }
    table.appendChild(tr);
  });
  if (block.data.sums) {
    const sumRow = document.createElement('tr');
    block.data.rows[0].forEach(() => { const td = document.createElement('td'); td.className = 'sum'; sumRow.appendChild(td); });
    const corner = document.createElement('td'); corner.className = 'sum'; sumRow.appendChild(corner);
    table.appendChild(sumRow);
    updateSums(table, block.data);
  }
  wrap.appendChild(table);
  const d = document.createElement('button'); d.className = 'block-del'; d.textContent = '×'; d.title = 'Remove';
  d.addEventListener('click', () => removeBlock(idx)); wrap.appendChild(d);
  return wrap;
}

function renderBlocks() {
  blocksEl.innerHTML = '';
  if (currentBlocks.length === 0) currentBlocks.push({ type: 'text', content: '' });
  currentBlocks.forEach((block, idx) => {
    let el;
    if (block.type === 'image') el = createImageBlockEl(block, idx);
    else if (block.type === 'table') el = createTableBlockEl(block, idx);
    else el = createTextBlockEl(block, idx);
    blocksEl.appendChild(el);
  });
  $('count').textContent = currentBlocks.length + (currentBlocks.length === 1 ? ' block' : ' blocks');
}

function insertImageAfterFocused(dataUrl) {
  let pos = lastFocusedIdx == null ? currentBlocks.length - 1 : lastFocusedIdx;
  currentBlocks.splice(pos + 1, 0, { type: 'image', data: dataUrl });
  if (!(currentBlocks[pos + 2] && currentBlocks[pos + 2].type === 'text')) currentBlocks.splice(pos + 2, 0, { type: 'text', content: '' });
  renderBlocks(); scheduleSave(); toast('Image added');
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleImageFile(file) {
  if (!loggedIn) return toast('Sign in to add images');
  if (!file || !file.type.startsWith('image/')) return;
  try {
    const dataUrl = await compressImage(file);
    if (dataUrl.length > 1500000) toast('That image is large — saved, but consider a smaller screenshot');
    insertImageAfterFocused(dataUrl);
  } catch (e) { toast('Could not read that image'); }
}

blocksEl.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items; if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith('image/')) {
      e.preventDefault(); handleImageFile(item.getAsFile()); return;
    }
  }
});
blocksEl.addEventListener('dragover', e => { e.preventDefault(); blocksEl.classList.add('drag-over'); });
blocksEl.addEventListener('dragleave', () => blocksEl.classList.remove('drag-over'));
blocksEl.addEventListener('drop', e => {
  e.preventDefault(); blocksEl.classList.remove('drag-over');
  const files = e.dataTransfer && e.dataTransfer.files; if (!files || !files.length) return;
  Array.from(files).forEach(handleImageFile);
});

$('addTextBtn').addEventListener('click', () => { if (!loggedIn) return toast('Sign in first'); currentBlocks.push({ type: 'text', content: '' }); renderBlocks(); scheduleSave(); });
$('addTableBtn').addEventListener('click', () => { if (!loggedIn) return toast('Sign in first'); currentBlocks.push({ type: 'table', data: { rows: [['', '', ''], ['', '', '']], sums: false } }); renderBlocks(); scheduleSave(); });
$('addImageBtn').addEventListener('click', () => { if (!loggedIn) return toast('Sign in first'); $('imageFileInput').click(); });
$('imageFileInput').addEventListener('change', e => { Array.from(e.target.files).forEach(handleImageFile); e.target.value = ''; });

// ---- Notes list / switching ----
function renderTabs() {
  tabsEl.innerHTML = '';
  Object.entries(notesIndexCache)
    .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0))
    .forEach(([id, meta]) => {
      const tab = document.createElement('div'); tab.className = 'note-tab' + (id === currentNoteId ? ' active' : '');
      const label = document.createElement('span'); label.textContent = meta.title || 'Untitled note'; tab.appendChild(label);
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
      x.addEventListener('click', e => { e.stopPropagation(); deleteNote(id); });
      tab.appendChild(x);
      tab.addEventListener('click', () => openNote(id));
      tabsEl.appendChild(tab);
    });
  const addBtn = document.createElement('button'); addBtn.className = 'new-note-btn'; addBtn.id = 'new-note-btn';
  addBtn.textContent = '+'; addBtn.title = 'New note'; addBtn.disabled = !loggedIn;
  addBtn.addEventListener('click', newNote);
  tabsEl.appendChild(addBtn);
}

function openNote(id) {
  if (noteRef) noteRef.off();
  currentNoteId = id;
  renderTabs();
  titleInput.value = (notesIndexCache[id] && notesIndexCache[id].title) || '';
  noteRef = db.ref('notes/' + id);
  noteRef.on('value', snap => {
    if (blocksEl.contains(document.activeElement)) return; // don't clobber active typing
    const val = snap.val();
    currentBlocks = (val && val.blocks) || [{ type: 'text', content: '' }];
    renderBlocks();
  });
}

function newNote() {
  if (!loggedIn) return toast('Sign in first');
  const id = db.ref('notesIndex').push().key;
  db.ref('notesIndex/' + id).set({ title: 'Untitled note', updatedAt: Date.now() });
  db.ref('notes/' + id).set({ blocks: [{ type: 'text', content: '' }] });
  openNote(id);
}

function deleteNote(id) {
  if (!loggedIn) return;
  if (!confirm('Delete this note? This cannot be undone.')) return;
  db.ref('notesIndex/' + id).remove();
  db.ref('notes/' + id).remove();
  if (currentNoteId === id) { if (noteRef) noteRef.off(); currentNoteId = null; noteRef = null; }
}

function migrateOrCreateFirst() {
  db.ref('settings/scratchpad').once('value').then(snap => {
    const old = snap.val();
    const id = db.ref('notesIndex').push().key;
    const title = 'Note 1';
    const blocks = old && String(old).trim() ? [{ type: 'text', content: String(old) }] : [{ type: 'text', content: '' }];
    db.ref('notesIndex/' + id).set({ title, updatedAt: Date.now() });
    db.ref('notes/' + id).set({ blocks });
    openNote(id);
  });
}

titleInput.addEventListener('input', () => {
  if (!currentNoteId || !loggedIn) return;
  clearTimeout(titleSaveTimeout);
  titleSaveTimeout = setTimeout(() => {
    db.ref('notesIndex/' + currentNoteId + '/title').set(titleInput.value || 'Untitled note');
  }, 400);
});

auth.onAuthStateChanged(user => {
  loggedIn = !!user;
  updateAuthUI();
  if (loggedIn) {
    setStatus('Synced', 'ok');
    db.ref('notesIndex').on('value', snap => {
      notesIndexCache = snap.val() || {};
      renderTabs();
      if (!currentNoteId) {
        const ids = Object.keys(notesIndexCache);
        if (ids.length) openNote(ids.sort((a, b) => (notesIndexCache[b].updatedAt || 0) - (notesIndexCache[a].updatedAt || 0))[0]);
        else migrateOrCreateFirst();
      } else if (!notesIndexCache[currentNoteId]) {
        currentNoteId = null; // current note was deleted elsewhere
      }
    });
  } else {
    setStatus('Not signed in', 'err');
    if (noteRef) noteRef.off();
    db.ref('notesIndex').off();
    blocksEl.innerHTML = '<div class="block text-block"><textarea readonly placeholder="Sign in to view your notes"></textarea></div>';
  }
});

// Create a history state so the phone's back button can be intercepted
window.history.pushState({ page: 'calculator' }, "", "");
window.addEventListener('popstate', function() {
  window.history.back();
});
</script>
</body>
