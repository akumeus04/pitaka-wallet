<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitaka Smart Calculator & Notes</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #eef2f1;
  --card: #ffffff;
  --text: #10231f;
  --text-2: #4b5f5a;
  --text-3: #8a9c97;
  --border: #dce4e2;
  --key: #f2f5f4;
  --key-hover: #e6ecea;
  --sar: #0f7b5f;
  --sar-soft: #e3f4ee;
  --php: #2456c5;
  --php-soft: #e6edfb;
  --accent: #0f7b5f;
  --danger: #c62828;
  --ok: #0f7b5f;
  --shadow: 0 1px 2px rgba(16,35,31,.06), 0 8px 24px -12px rgba(16,35,31,.18);
  --font: 'Sora', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
:root[data-theme="dark"] {
  --bg: #0c1614;
  --card: #142220;
  --text: #e6f0ed;
  --text-2: #a3b7b1;
  --text-3: #6b807a;
  --border: #243633;
  --key: #1b2c29;
  --key-hover: #243836;
  --sar: #3ccf9f;
  --sar-soft: #12332b;
  --php: #7ea6ff;
  --php-soft: #16264d;
  --accent: #3ccf9f;
  --danger: #ff7b72;
  --ok: #3ccf9f;
  --shadow: 0 8px 24px -12px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 20px;
  font-family: var(--font); background: var(--bg); color: var(--text);
  display: flex; justify-content: center;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { width: 100%; max-width: 1040px; display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; }

.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.head-actions { display: flex; align-items: center; gap: 8px; }
.meta { font-size: 12px; color: var(--text-3); }
.icon-btn {
  border: 1px solid var(--border); background: var(--key); border-radius: 10px;
  width: 34px; height: 34px; cursor: pointer; font-size: 15px; line-height: 1;
  display: grid; place-items: center; transition: background .15s;
}
.icon-btn:hover { background: var(--key-hover); }
.icon-btn.spin { animation: spin .7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Converter ── */
.rate-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.rate-big { font-family: var(--mono); font-size: 13px; color: var(--text-2); }
.rate-big b { color: var(--text); font-weight: 600; }

.pair { position: relative; display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px;
  border-radius: 14px; padding: 12px 14px; border: 1.5px solid transparent;
  transition: border-color .15s;
}
.row[data-cur="SAR"] { background: var(--sar-soft); }
.row[data-cur="PHP"] { background: var(--php-soft); }
.row:focus-within[data-cur="SAR"] { border-color: var(--sar); }
.row:focus-within[data-cur="PHP"] { border-color: var(--php); }
.cur { display: flex; flex-direction: column; min-width: 54px; }
.cur b { font-size: 15px; font-weight: 700; }
.cur small { font-size: 11px; color: var(--text-2); }
.row[data-cur="SAR"] .cur b { color: var(--sar); }
.row[data-cur="PHP"] .cur b { color: var(--php); }
.row input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none;
  text-align: right; font-family: var(--mono); font-size: 24px; font-weight: 600; color: var(--text);
}
.row input::placeholder { color: var(--text-3); }
.swap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--card);
  background: var(--text); color: var(--card); cursor: pointer; font-size: 16px;
  display: grid; place-items: center; transition: transform .25s;
}
.swap.flip { transform: translate(-50%, -50%) rotate(180deg); }

.chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.chip {
  flex: 1; min-width: 56px; padding: 8px 6px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: var(--key);
  font-family: var(--mono); font-size: 13px; font-weight: 500; transition: background .15s;
}
.chip:hover { background: var(--key-hover); }
.conv-actions { display: flex; gap: 8px; margin-top: 10px; }
.text-btn {
  flex: 1; padding: 9px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; font-size: 12px; font-weight: 500; color: var(--text-2);
}
.text-btn:hover { background: var(--key); color: var(--text); }

/* ── Calculator ── */
.screen {
  background: var(--key); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
  text-align: right; font-family: var(--mono); min-height: 88px;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.prev { font-size: 13px; color: var(--text-3); min-height: 20px; overflow-wrap: anywhere; }
.curr { font-size: 34px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.2; }
.curr.err { color: var(--danger); font-size: 22px; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.keys button {
  padding: 16px 0; font-size: 18px; font-weight: 500; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); transition: background .12s, transform .05s;
}
.keys button:hover { background: var(--key-hover); }
.keys button:active { transform: scale(.96); }
.keys .fn { background: var(--key); color: var(--text-2); font-size: 15px; }
.keys .op { background: var(--sar-soft); color: var(--sar); border-color: transparent; font-size: 20px; }
.keys .op.active { background: var(--sar); color: var(--card); }
.keys .eq { background: var(--sar); color: #fff; border-color: transparent; }
.keys .eq:hover { filter: brightness(1.08); background: var(--sar); }
.keys .wide { grid-column: span 2; }

/* ── Notes ── */
.notes { display: flex; flex-direction: column; min-height: 560px; }
.notes textarea {
  flex: 1; width: 100%; resize: none; outline: none; padding: 16px 18px;
  border: 1px solid var(--border); border-radius: 14px; background: var(--key); color: var(--text);
  font-family: var(--mono); font-size: 14px; line-height: 1.7; transition: border-color .15s, background .15s;
}
.notes textarea:focus { border-color: var(--accent); background: var(--card); }
.notes textarea[readonly] { opacity: .6; cursor: not-allowed; }
.foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--text-3); }
.status { font-weight: 600; }
.status.ok { color: var(--ok); } .status.err { color: var(--danger); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 10px;
  font-size: 13px; pointer-events: none; transition: all .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 800px) {
  body { padding: 12px; }
  .app { grid-template-columns: 1fr; }
  .notes { min-height: 340px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <div class="col">
    <!-- CONVERTER -->
    <section class="card">
      <div class="head">
        <h2>Currency converter</h2>
        <div class="head-actions">
          <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
          <button class="icon-btn" id="refreshBtn" title="Refresh rate" aria-label="Refresh rate">↻</button>
        </div>
      </div>
      <div class="rate-line">
        <span class="rate-big" id="rateMain">1 SAR = <b>…</b> PHP</span>
        <span class="meta" id="rateMeta">Loading rate…</span>
      </div>

      <div class="pair" id="pair">
        <div class="row" id="rowTop" data-cur="SAR">
          <div class="cur"><b>SAR</b><small>Saudi riyal</small></div>
          <input id="topInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount to convert">
        </div>
        <div class="row" id="rowBottom" data-cur="PHP">
          <div class="cur"><b>PHP</b><small>Philippine peso</small></div>
          <input id="bottomInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Converted amount">
        </div>
        <button class="swap" id="swapBtn" title="Swap direction (SAR ⇄ PHP)" aria-label="Swap direction">⇅</button>
      </div>

      <div class="chips" id="chips"></div>
      <div class="conv-actions">
        <button class="text-btn" id="copyBtn">Copy result</button>
        <button class="text-btn" id="toCalcBtn">Send to calculator</button>
      </div>
    </section>

    <!-- CALCULATOR -->
    <section class="card">
      <div class="screen">
        <div class="prev" id="prev"></div>
        <div class="curr" id="curr">0</div>
      </div>
      <div class="keys">
        <button class="fn" data-a="clear">AC</button>
        <button class="fn" data-a="neg">±</button>
        <button class="fn" data-a="pct">%</button>
        <button class="op" data-op="/" aria-label="Divide">÷</button>

        <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
        <button class="op" data-op="*" aria-label="Multiply">×</button>

        <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
        <button class="op" data-op="-" aria-label="Subtract">−</button>

        <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
        <button class="op" data-op="+" aria-label="Add">+</button>

        <button data-n="0">0</button><button data-n=".">.</button>
        <button class="fn" data-a="del" aria-label="Delete last digit">⌫</button>
        <button class="eq" data-a="eq">=</button>
      </div>
      <div class="conv-actions">
        <button class="text-btn" id="toConvBtn">Send to converter</button>
      </div>
    </section>
  </div>

  <!-- NOTES -->
  <section class="card notes">
    <div class="head">
      <h2>Cloud scratchpad</h2>
      <span class="status" id="saveStatus">Connecting…</span>
    </div>
    <textarea id="scratchpadInput" placeholder="Type notes or calculations here. Everything saves automatically to your database."></textarea>
    <div class="foot"><span id="count">0 characters</span><span>Auto-saves while you type</span></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
    // ==========================================
    // FIREBASE INITIALIZATION
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyAc46X6MIXI-moZ2oTy2ShiDv6IrjhVQC4",
      authDomain: "finance-app-23309.firebaseapp.com",
      databaseURL: "https://finance-app-23309-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "finance-app-23309",
      storageBucket: "finance-app-23309.firebasestorage.app",
      messagingSenderId: "268979076437",
      appId: "1:268979076437:web:204abafc00e7558f4e83dc",
    };
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
const db = firebase.database();

// ==========================================
// HELPERS
// ==========================================
const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function withCommas(str) {               // "1234567.5" -> "1,234,567.5" (keeps typing state)
  const neg = str.startsWith('-'); if (neg) str = str.slice(1);
  const [i, d] = str.split('.');
  const out = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d !== undefined ? '.' + d : '');
  return (neg ? '-' : '') + out;
}
function num(str) { return parseFloat(String(str).replace(/,/g, '')); }
function fmtMoney(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// ==========================================
// THEME
// ==========================================
(function () {
  const saved = store('pitaka-theme');
  const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
$('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store('pitaka-theme', next);
});

// ==========================================
// CONVERTER  (top row = "from", bottom row = "to")
// ==========================================
let rate = parseFloat(store('pitaka-rate')) || 14.8;   // PHP per 1 SAR
let topCur = 'SAR';                                     // 'SAR' → PHP, or 'PHP' → SAR
const topInput = $('topInput'), bottomInput = $('bottomInput');

function convert(amount, from) { return from === 'SAR' ? amount * rate : amount / rate; }

function renderRate(label) {
  $('rateMain').innerHTML = `1 SAR = <b>${rate.toFixed(4)}</b> PHP`;
  $('rateMeta').textContent = label;
}
async function fetchRate(manual) {
  $('refreshBtn').classList.add('spin');
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/SAR');
    const data = await res.json();
    if (!data.rates || !data.rates.PHP) throw new Error('no rate');
    rate = data.rates.PHP; store('pitaka-rate', rate);
    renderRate('Live · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    recalc();
    if (manual) toast('Rate updated');
  } catch (e) {
    renderRate(store('pitaka-rate') ? 'Offline · last saved rate' : 'Offline · default rate');
    if (manual) toast('Could not refresh. Check your connection.');
  }
  setTimeout(() => $('refreshBtn').classList.remove('spin'), 700);
}
function setCurrencyLabels() {
  const info = { SAR: 'Saudi riyal', PHP: 'Philippine peso' };
  const bottomCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  [['rowTop', topCur], ['rowBottom', bottomCur]].forEach(([id, c]) => {
    const row = $(id); row.dataset.cur = c;
    row.querySelector('b').textContent = c; row.querySelector('small').textContent = info[c];
  });
  const amounts = topCur === 'SAR' ? [100, 500, 1000, 5000] : [1000, 5000, 10000, 50000];
  $('chips').innerHTML = amounts.map(a => `<button class="chip" data-v="${a}">${a.toLocaleString('en-US')}</button>`).join('');
}
function cleanTyping(el) {                    // allow digits + one dot, add commas live
  let v = el.value.replace(/[^\d.]/g, '');
  const p = v.indexOf('.'); if (p !== -1) v = v.slice(0, p + 1) + v.slice(p + 1).replace(/\./g, '');
  el.value = v ? withCommas(v) : '';
}
function recalc() {
  const a = num(topInput.value);
  bottomInput.value = isNaN(a) ? '' : fmtMoney(convert(a, topCur));
}
topInput.addEventListener('input', () => { cleanTyping(topInput); recalc(); });
bottomInput.addEventListener('input', () => {
  cleanTyping(bottomInput);
  const b = num(bottomInput.value);
  const bottomCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  topInput.value = isNaN(b) ? '' : fmtMoney(convert(b, bottomCur));
});
$('swapBtn').addEventListener('click', () => {
  const result = bottomInput.value;
  topCur = topCur === 'SAR' ? 'PHP' : 'SAR';
  setCurrencyLabels();
  topInput.value = result; recalc();
  $('swapBtn').classList.toggle('flip');
});
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  topInput.value = withCommas(c.dataset.v); recalc();
});
$('copyBtn').addEventListener('click', async () => {
  if (!bottomInput.value) return toast('Enter an amount first');
  const text = bottomInput.value.replace(/,/g, '');
  try { await navigator.clipboard.writeText(text); toast('Copied ' + bottomInput.value); }
  catch (e) { bottomInput.select(); document.execCommand('copy'); toast('Copied ' + bottomInput.value); }
});
$('toCalcBtn').addEventListener('click', () => {
  const v = num(bottomInput.value); if (isNaN(v)) return toast('Enter an amount first');
  cur = String(v.toFixed(2)); prevStr = ''; op = null; justComputed = false; render();
  toast('Sent to calculator');
});
$('refreshBtn').addEventListener('click', () => fetchRate(true));

setCurrencyLabels(); renderRate('Loading rate…'); fetchRate(false);

// ==========================================
// CALCULATOR
// ==========================================
let cur = '', prevStr = '', op = null, justComputed = false;
const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

function render() {
  const c = $('curr');
  if (cur === 'Error') { c.textContent = 'Cannot divide by zero'; c.classList.add('err'); }
  else { c.textContent = cur ? withCommas(cur) : '0'; c.classList.remove('err'); }
  $('prev').textContent = op ? `${withCommas(prevStr)} ${symbols[op]}` : '';
  document.querySelectorAll('.keys .op').forEach(b => b.classList.toggle('active', b.dataset.op === op && cur === ''));
}
function tidy(n) { return String(parseFloat(n.toPrecision(12))); }   // avoids 0.1+0.2 noise

function inputDigit(d) {
  if (cur === 'Error' || justComputed) { cur = ''; justComputed = false; }
  if (d === '.') { if (cur.includes('.')) return; if (cur === '' || cur === '-') cur += '0'; }
  else if (cur === '0') cur = '';
  if (cur.replace(/[-.]/g, '').length >= 15) return;
  cur += d; render();
}
function chooseOp(o) {
  if (cur === 'Error') return;
  if (cur === '' && prevStr !== '') { op = o; render(); return; }   // change operator
  if (cur === '') return;
  if (prevStr !== '' && op) compute(true);
  op = o; prevStr = cur; cur = ''; justComputed = false; render();
}
function compute(chain) {
  if (!op || prevStr === '' || cur === '') return;
  const a = parseFloat(prevStr), b = parseFloat(cur); let r;
  switch (op) {
    case '+': r = a + b; break; case '-': r = a - b; break;
    case '*': r = a * b; break; case '/': r = b === 0 ? null : a / b; break;
  }
  if (r === null) { cur = 'Error'; prevStr = ''; op = null; render(); return; }
  cur = tidy(r); prevStr = ''; op = null; justComputed = !chain; render();
}
function clearAll() { cur = ''; prevStr = ''; op = null; justComputed = false; render(); }
function del() { if (justComputed || cur === 'Error') return clearAll(); cur = cur.slice(0, -1); render(); }
function negate() { if (!cur || cur === 'Error') return; cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; render(); }
function percent() {
  if (!cur || cur === 'Error') return;
  const v = parseFloat(cur);
  cur = tidy(prevStr !== '' && (op === '+' || op === '-') ? parseFloat(prevStr) * v / 100 : v / 100); render();
}

document.querySelector('.keys').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.n) inputDigit(b.dataset.n);
  else if (b.dataset.op) chooseOp(b.dataset.op);
  else switch (b.dataset.a) {
    case 'clear': clearAll(); break; case 'del': del(); break; case 'neg': negate(); break;
    case 'pct': percent(); break; case 'eq': compute(false); break;
  }
});
$('toConvBtn').addEventListener('click', () => {
  const v = num(cur || '0'); if (isNaN(v) || cur === 'Error') return toast('Nothing to send');
  topInput.value = withCommas(String(v)); recalc(); toast(`Sent to converter as ${topCur}`);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName.toLowerCase();
  if (tag === 'textarea' || tag === 'input' || e.ctrlKey || e.metaKey) return;
  if (/^[0-9.]$/.test(e.key)) inputDigit(e.key);
  else if (['+', '-', '*', '/'].includes(e.key)) { e.preventDefault(); chooseOp(e.key); }
  else if (e.key === '=' || e.key === 'Enter') { e.preventDefault(); compute(false); }
  else if (e.key === 'Backspace') del();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '%') percent();
});
render();

// ==========================================
// SCRATCHPAD (same Firebase path: settings/scratchpad)
// ==========================================
const pad = $('scratchpadInput'), status = $('saveStatus');
let saveTimeout;
function setStatus(text, cls) { status.textContent = text; status.className = 'status ' + (cls || ''); }
function updateCount() { $('count').textContent = pad.value.length.toLocaleString('en-US') + ' characters'; }

auth.onAuthStateChanged(user => {
  if (user) {
    setStatus('Synced', 'ok');
    db.ref('settings/scratchpad').once('value').then(snap => {
      if (snap.exists()) { pad.value = snap.val(); updateCount(); }
    });
    db.ref('settings/scratchpad').on('value', snap => {
      if (document.activeElement !== pad && snap.exists()) { pad.value = snap.val(); updateCount(); }
    });
  } else {
    setStatus('Not signed in', 'err');
    pad.readOnly = true;
  }
});
pad.addEventListener('input', () => {
  updateCount();
  if (!auth.currentUser) return;
  setStatus('Saving…');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    db.ref('settings/scratchpad').set(pad.value)
      .then(() => setStatus('Saved', 'ok'))
      .catch(() => setStatus('Could not save. Check your connection.', 'err'));
  }, 1000);
});
</script>
</body>
</html>
